[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,LICENSE,THIRD_PARTY_NOTICES.md"
exclude_filter="vercel.json,.vercel/*,assets/source/*,legacy/*,tests/*,docs/*,packaging/*,work/*,build/*,.ci-godot/*,dist/*"
export_path="build/web/index.html"
[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/custom_html_shell="res://packaging/web_shell.html"
progressive_web_app/enabled=false

